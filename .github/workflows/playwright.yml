name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Checkout system under test (Toolshop)
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Start Toolshop application (Docker Compose)
        working-directory: toolshop-app
        run: |
          # Some docker-compose based Laravel setups require a .env file
          # (copied from .env.example) before `docker compose up` will
          # succeed — check for its presence/setup instructions in the
          # repo's README/docs before assuming this step should just work.
          docker compose up -d

      - name: Show container status (debug)
        if: always()
        working-directory: toolshop-app
        run: docker compose ps

      - name: Wait for application to be ready
        run: |
          # The project's own README states the first `docker compose up -d`
          # can take up to 5 minutes (no layer cache yet). A CI runner has
          # zero cache on every run, so we allow generous headroom here
          # rather than reusing a timeout that only worked locally because
          # images were already cached from prior local runs.
          echo "Waiting for frontend..."
          timeout 480 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 5; done'
          echo "Waiting for API..."
          timeout 480 bash -c 'until curl -sf http://localhost:8091/products > /dev/null; do sleep 5; done'

      - name: Show container logs (debug, only on failure)
        if: failure()
        working-directory: toolshop-app
        run: docker compose logs

      - name: Seed test database
        working-directory: toolshop-app
        run: docker compose exec -T laravel-api php artisan migrate:fresh --seed

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report (workflow artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Separate artifact upload specifically for the Pages deploy job below.
      # Only relevant on a push to main — PR runs still get the regular
      # artifact above for local inspection, but should never overwrite
      # the published report.
      - name: Upload report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Stop Toolshop application
        if: always()
        working-directory: toolshop-app
        run: docker compose down

  publish-report:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4