name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      # --- Test project setup (runs first: fails fast, and avoids competing
      # --- for runner resources with the Toolshop containers) ---

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        timeout-minutes: 10

      # --- System under test ---

      - name: Checkout system under test (Toolshop)
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Fix bind-mount permissions for container write access
        working-directory: toolshop-app
        run: |
          # The API directory is bind-mounted into the laravel-api container.
          # PHP-FPM runs as a different user than the runner and needs write
          # access to storage/ and .env.
          chmod -R 777 .

      - name: Start Toolshop application (Docker Compose)
        working-directory: toolshop-app
        run: docker compose up -d

      - name: Show container status
        if: always()
        working-directory: toolshop-app
        run: docker compose ps

      - name: Wait for composer install to finish
        working-directory: toolshop-app
        run: |
          # The composer service is a one-shot container; wait for it to exit
          # before running migrations.
          CID=$(docker compose ps -q composer)
          EXIT_CODE=$(docker wait "$CID")
          echo "composer container exited with code $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            docker compose logs composer
            exit 1
          fi

      - name: Generate Laravel application key
        working-directory: toolshop-app
        run: docker compose exec -T laravel-api php artisan key:generate --force

      - name: Wait for containers to accept connections
        run: |
          echo "Waiting for frontend..."
          timeout 480 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 5; done'
          echo "Waiting for API web server..."
          timeout 120 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/products | grep -qE "^[0-9]{3}$"; do sleep 5; done'

      - name: Seed test database
        working-directory: toolshop-app
        run: docker compose exec -T laravel-api php artisan migrate:fresh --seed

      - name: Fix storage/cache permissions after seeding
        working-directory: toolshop-app
        run: |
          # Seeding recreates log and cache files owned by another user;
          # re-apply permissions as root so PHP-FPM can write to them.
          docker compose exec -u root -T laravel-api chmod -R 777 storage bootstrap/cache

      - name: Verify API is serving data
        run: timeout 120 bash -c 'until curl -sf http://localhost:8091/products > /dev/null; do sleep 3; done'

      - name: Diagnostics on failure
        if: failure()
        working-directory: toolshop-app
        run: |
          docker compose logs
          echo "--- Laravel log ---"
          docker compose exec -T laravel-api cat storage/logs/laravel.log || echo "No laravel.log found"
          echo "--- Response from /products ---"
          curl -v http://localhost:8091/products 2>&1 || true

      # --- Tests ---

      - name: Run Playwright tests
        # @wip scenarios are excluded: known limitation, see README and docs/test-strategy.md.
        run: npm test -- --grep-invert @wip

      - name: Upload test report (workflow artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Only a push to main publishes the report to GitHub Pages.
      - name: Upload report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Stop Toolshop application
        if: always()
        working-directory: toolshop-app
        run: docker compose down

  publish-report:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4