name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Checkout system under test (Toolshop)
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Fix bind-mount permissions for container write access
        working-directory: toolshop-app
        run: |
          # Root cause (confirmed via actual error, not a guess this time):
          # "Permission denied" writing to storage/logs/laravel.log and .env.
          # The Toolshop API directory is bind-mounted into the laravel-api
          # container; files checked out by GitHub Actions are owned by the
          # runner user, while PHP-FPM inside the container runs as a
          # different (more restricted) user, which can't write to them.
          # This also explains why storage/logs/laravel.log never existed
          # in earlier debug attempts — Laravel couldn't even write its own
          # error log because of this same permission mismatch.
          chmod -R 777 .

      - name: Start Toolshop application (Docker Compose)
        working-directory: toolshop-app
        run: |
          docker compose up -d

      - name: Show container status (debug)
        if: always()
        working-directory: toolshop-app
        run: docker compose ps

      - name: Wait for composer (dependency install) to finish
        working-directory: toolshop-app
        run: |
          # The `composer` service is a one-shot container that runs
          # `composer install` for the Laravel API. It's not a long-running
          # service, so `docker compose up -d` returning doesn't mean it's
          # done — confirmed via logs: it was still mid-install (downloading/
          # extracting packages) well after our previous readiness checks
          # had already passed, causing `migrate:fresh --seed` to run before
          # Laravel's vendor/ directory was fully populated.
          # `docker wait` blocks until the container exits and prints its
          # exit code.
          CID=$(docker compose ps -q composer)
          EXIT_CODE=$(docker wait "$CID")
          echo "composer container exited with code $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "composer install failed — showing its logs:"
            docker compose logs composer
            exit 1
          fi

      - name: Generate Laravel application key
        working-directory: toolshop-app
        run: |
          # Laravel requires an APP_KEY (used for encrypting sessions/cookies)
          # to boot at all. Locally this may already be set from a prior run
          # (persisted in the committed .env or a Docker volume) — on a fresh
          # CI checkout it may be missing, which would cause every single
          # request to fail with a generic 500 and no application-level log
          # entry (the failure happens too early in the boot process for
          # Laravel's own exception handler to log it).
          docker compose exec -T laravel-api php artisan key:generate --force

      - name: Wait for containers to accept connections
        run: |
          echo "Waiting for frontend..."
          timeout 480 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 5; done'
          echo "Waiting for API web server (any HTTP response)..."
          timeout 120 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/products | grep -qE "^[0-9]{3}$"; do sleep 5; done'

      - name: Show container logs (debug, only on failure)
        if: failure()
        working-directory: toolshop-app
        run: docker compose logs

      - name: Show Laravel application log (debug, only on failure)
        if: failure()
        working-directory: toolshop-app
        run: |
          # docker compose logs only shows the HTTP status code (500),
          # not the actual PHP/Laravel error behind it. This dumps the
          # real stack trace so we stop guessing at architecture issues
          # and see the concrete cause.
          docker compose exec -T laravel-api cat storage/logs/laravel.log || echo "No laravel.log found or command failed"

      - name: Show raw HTTP response body (debug, only on failure)
        if: failure()
        run: |
          # curl -sf discards the response body on a non-2xx status.
          # Dropping -f shows us exactly what the server returns —
          # laravel.log doesn't exist, so this may be the only place
          # the actual error message is visible.
          echo "--- Response from /products ---"
          curl -v http://localhost:8091/products 2>&1 || true
          echo "--- Response from / (root) ---"
          curl -v http://localhost:8091/ 2>&1 || true

      - name: Seed test database
        working-directory: toolshop-app
        run: docker compose exec -T laravel-api php artisan migrate:fresh --seed

      - name: Verify API is serving data after seeding
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8091/products > /dev/null; do sleep 3; done'

      - name: Show container logs (debug, only on failure, post-seed)
        if: failure()
        working-directory: toolshop-app
        run: docker compose logs

      - name: Show Laravel application log (debug, only on failure, post-seed)
        if: failure()
        working-directory: toolshop-app
        run: docker compose exec -T laravel-api cat storage/logs/laravel.log || echo "No laravel.log found or command failed"

      - name: Show raw HTTP response body (debug, only on failure, post-seed)
        if: failure()
        run: |
          echo "--- Response from /products ---"
          curl -v http://localhost:8091/products 2>&1 || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report (workflow artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Separate artifact upload specifically for the Pages deploy job below.
      # Only relevant on a push to main — PR runs still get the regular
      # artifact above for local inspection, but should never overwrite
      # the published report.
      - name: Upload report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Stop Toolshop application
        if: always()
        working-directory: toolshop-app
        run: docker compose down

  publish-report:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4